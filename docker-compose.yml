version: "3.9"

# ── Agentic Drift Detector — Production Orchestration ──────────────────────────
#
# Services:
#   postgres  — TimescaleDB (PostgreSQL 15 + time-series extension)
#   redis     — Redis 7 (async telemetry queue + LangChain semantic cache)
#   api       — FastAPI Backend exposing the LangGraph workflow
#   ui        — Streamlit Dashboard
#   worker    — Background queue drain worker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: drift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     drift
      POSTGRES_PASSWORD: drift
      POSTGRES_DB:       drift
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U drift -d drift"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drift-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: drift-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://drift:drift@postgres:5432/drift
      REDIS_URL:    redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Streamlit Dashboard ─────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: drift-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://drift:drift@postgres:5432/drift
      API_URL:      http://api:8000
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  # ── Background Telemetry Worker ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: drift-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://drift:drift@postgres:5432/drift
      REDIS_URL:    redis://redis:6379/0
      TENANT_ID:    ${TENANT_ID:-default}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SLACK_WEBHOOK_URL:    ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL:  ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
